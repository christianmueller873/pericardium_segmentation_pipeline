<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title description">
  <title id="title">Dual-agent segmentation system overview</title>
  <desc id="description">A CT volume is processed by two segmentation agents. Their outputs pass through agreement and connectedness gates, conservative fusion, the FastAPI response, and the browser CT viewer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#465363"/>
    </marker>
  </defs>
  <rect width="1400" height="430" rx="20" fill="#f6f8fa"/>
  <g fill="none" stroke="#465363" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 200 215 C 245 215, 245 110, 290 110"/>
    <path d="M 200 215 C 245 215, 245 320, 290 320"/>
    <path d="M 510 110 C 555 110, 555 215, 600 215"/>
    <path d="M 510 320 C 555 320, 555 215, 600 215"/>
    <path d="M 790 215 L 845 215"/>
    <path d="M 1025 215 L 1080 215"/>
    <path d="M 1235 215 L 1280 215"/>
  </g>
  <g stroke="#465363" stroke-width="3">
    <rect x="35" y="160" width="165" height="110" rx="14" fill="#ffffff"/>
    <rect x="290" y="50" width="220" height="120" rx="14" fill="#dbeafe"/>
    <rect x="290" y="260" width="220" height="120" rx="14" fill="#dcfce7"/>
    <rect x="600" y="150" width="190" height="130" rx="14" fill="#fef3c7"/>
    <rect x="845" y="160" width="180" height="110" rx="14" fill="#f3e8ff"/>
    <rect x="1080" y="160" width="155" height="110" rx="14" fill="#ffffff"/>
    <rect x="1280" y="160" width="85" height="110" rx="14" fill="#ffffff"/>
  </g>
  <g fill="#17202a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="117" y="205" font-size="24" font-weight="700">NIfTI CT</text>
    <text x="117" y="237" font-size="22">volume</text>
    <text x="400" y="88" font-size="24" font-weight="700">Agent 1</text>
    <text x="400" y="120" font-size="21">2D nnU-Net</text>
    <text x="400" y="148" font-size="19">coarse guide</text>
    <text x="400" y="298" font-size="24" font-weight="700">Agent 2</text>
    <text x="400" y="330" font-size="21">3D residual U-Net</text>
    <text x="400" y="358" font-size="19">precise boundary</text>
    <text x="695" y="202" font-size="22" font-weight="700">Agreement and</text>
    <text x="695" y="234" font-size="22" font-weight="700">connectedness</text>
    <text x="695" y="262" font-size="20">gates</text>
    <text x="935" y="207" font-size="22" font-weight="700">Conservative</text>
    <text x="935" y="239" font-size="22" font-weight="700">fusion</text>
    <text x="1157" y="207" font-size="22" font-weight="700">FastAPI</text>
    <text x="1157" y="239" font-size="20">response</text>
    <text x="1322" y="202" font-size="20" font-weight="700">CT</text>
    <text x="1322" y="230" font-size="20">viewer</text>
  </g>
</svg>
